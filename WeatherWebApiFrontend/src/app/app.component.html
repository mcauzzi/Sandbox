<div id="header"></div>
<div id="mainBody">
  <div id="sideMenu" [ngStyle]="menuPanel.collapsed ? {'width': '10%'} : {'width': '20%'}">
    <p-panel #menuPanel header="Main Menu" [toggleable]="true"
      ><p-menu [model]="routingItems" />
    </p-panel>
  </div>
  <div id="content">
    <div *ngIf="!isLoggedIn; else LoggedInBlock">
      <app-login></app-login>
    </div>
    <ng-template #LoggedInBlock><router-outlet /></ng-template>
  </div>
</div>
